<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Bites | Admin sign in</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fffaF1;color:#302d29;font-family:'DM Sans',sans-serif;padding:20px}.card{width:min(430px,100%);background:white;border:1px solid #eee4d5;border-radius:22px;padding:32px;box-shadow:0 18px 55px #402f0c12}.mark{width:48px;height:48px;border-radius:15px;background:#ed821b;color:white;display:grid;place-items:center;font-weight:800}.eyebrow{color:#b56b20;font-size:11px;font-weight:800;letter-spacing:1.5px;margin:22px 0 7px}h1{font:800 27px Manrope;margin:0 0 8px}p{color:#81786d;font-size:14px;line-height:1.5}label{display:block;font-size:12px;font-weight:700;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #e5ddcf;border-radius:10px;font:inherit}button{width:100%;border:0;border-radius:10px;padding:14px;background:#ed821b;color:white;font-weight:700;font-size:14px;margin-top:22px;cursor:pointer}#message{min-height:20px;color:#a23d28;font-size:13px}</style></head>
<body><main class="card"><div class="mark">CB</div><div class="eyebrow">ADMIN CONSOLE</div><h1>Welcome back</h1><p>Sign in with an administrator account for Campus Bites.</p><form id="login-form"><label for="email">EMAIL ADDRESS</label><input id="email" type="email" autocomplete="username" required><label for="password">PASSWORD</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Sign in securely</button><p id="message" role="status"></p></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/supabase.js"></script><script>document.querySelector('#login-form').addEventListener('submit',async e=>{e.preventDefault();const msg=document.querySelector('#message');const btn=e.currentTarget.querySelector('button');btn.disabled=true;msg.textContent='Signing in…';try{const {data,error}=await window.cbSupabase.auth.signInWithPassword({email:document.querySelector('#email').value.trim(),password:document.querySelector('#password').value});if(error)throw error;const r=await fetch('/api/admin/me',{headers:{Authorization:'Bearer '+data.session.access_token}});if(!r.ok){await window.cbSupabase.auth.signOut();throw new Error('This account is not authorized as an administrator.');}location.replace('/admin');}catch(err){msg.textContent=err.message||'Unable to sign in.';}finally{btn.disabled=false;}});</script></body></html>
