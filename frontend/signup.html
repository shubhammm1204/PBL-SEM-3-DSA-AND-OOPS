<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Bites | Create account</title><link rel="stylesheet" href="logincss.css"><style>.login-box{max-width:460px;height:auto;min-height:540px;padding:24px 18px}.login-box .form{margin:16px 0}.login-box input{width:100%}#signup-message{min-height:22px;font-size:13px;color:#a33}.auth-links{text-align:center;margin-top:16px}.auth-links a{color:#d87513;font-weight:700}</style></head><body><div class="login-container"><h1 class="Welcome-heading">Join Campus Bites</h1></div><div class="login-box"><h1>Create account</h1><form id="signup-form"><div class="form"><input id="full-name" required autocomplete="name"><label for="full-name">Full name</label></div><div class="form"><input id="college-id" required><label for="college-id">College ID</label></div><div class="form"><input id="email" type="email" required autocomplete="email"><label for="email">College email</label></div><div class="form"><input id="password" type="password" minlength="8" required autocomplete="new-password"><label for="password">Password (8+ characters)</label></div><p id="signup-message" role="status"></p><input type="submit" id="btn" value="Create student account"></form><div class="auth-links">Already registered? <a href="login.html">Sign in</a></div><p style="font-size:12px;color:#777">Student accounts only. Faculty and administrator accounts must be provisioned by the canteen administrator.</p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/supabase.js"></script><script>
document.querySelector('#signup-form').addEventListener('submit',async e=>{e.preventDefault();const msg=document.querySelector('#signup-message'),btn=document.querySelector('#btn');btn.disabled=true;try{msg.textContent='Checking college ID…';const collegeId=document.querySelector('#college-id').value.trim().toUpperCase();const check=await fetch('/api/auth/check-college/'+encodeURIComponent(collegeId));const checkData=await check.json();if(!check.ok)throw new Error(checkData.error||'College ID not found');msg.textContent='Creating account…';const {data,error}=await window.cbSupabase.auth.signUp({email:document.querySelector('#email').value.trim(),password:document.querySelector('#password').value,user_metadata:{full_name:document.querySelector('#full-name').value.trim(),college_id:collegeId}});if(error)throw error;if(data.session){location.replace('/dashboard');}else{msg.style.color='#267342';msg.textContent='Account created. Check your email to confirm it, then sign in.';}}catch(err){msg.textContent=err.message||'Signup failed';}finally{btn.disabled=false;}});
</script></body></html>
